version: 2

models:
  - name: stg_kalshi_markets
    description: Typed staging table over raw Kalshi markets with normalized timestamps and numeric price fields.
    columns:
      - name: market_ticker
        description: Stable Kalshi market identifier sourced from RAW_MARKETS.ticker.
        tests:
          - not_null
          - unique
      - name: event_ticker
        description: Event identifier associated with the market.
        tests:
          - relationships:
              arguments:
                to: ref('stg_kalshi_events')
                field: event_ticker
      - name: market_title
        description: Human-readable market title.
      - name: market_type
        description: Kalshi-assigned market type, when supplied by the raw payload.
      - name: market_status
        description: Current lifecycle status reported by Kalshi for the market.
      - name: market_result
        description: Settled market outcome once the market resolves.
      - name: market_subtitle
        description: Secondary market label, either from subtitle or from matching yes/no subtitles.
      - name: yes_subtitle
        description: Yes-side market outcome label.
      - name: no_subtitle
        description: No-side market outcome label.
      - name: primary_rules
        description: Primary market resolution rules text.
      - name: secondary_rules
        description: Supplementary market resolution rules text.
      - name: response_price_units
        description: Unit system used by the Kalshi API for prices.
      - name: price_level_structure
        description: Description of how price levels are bucketed for the market.
      - name: strike_type
        description: Strike configuration assigned to the market.
      - name: expiration_value
        description: Strike expiration value used in market resolution logic.
      - name: early_close_condition
        description: Condition under which the market can close early.
      - name: primary_participant_key
        description: Key identifying the primary participant associated with the market.
      - name: can_close_early
        description: Whether the market can close early.
      - name: is_fractional_trading_enabled
        description: Whether fractional trading is enabled for the market.
      - name: created_at
        description: Market creation timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: open_at
        description: Market open timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: close_at
        description: Market close timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: expected_expiration_at
        description: Expected market expiration timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: expiration_at
        description: Market expiration timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: latest_expiration_at
        description: Latest possible market expiration timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: updated_at
        description: Market metadata update timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: fee_waiver_expiration_at
        description: Fee waiver expiration timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: last_price_dollars
        description: Last traded market price in dollars as a numeric value.
      - name: liquidity_dollars
        description: Available market liquidity in dollars as a numeric value.
      - name: no_ask_dollars
        description: Current no-side ask price in dollars as a numeric value.
      - name: no_bid_dollars
        description: Current no-side bid price in dollars as a numeric value.
      - name: notional_value_dollars
        description: Notional contract value in dollars as a numeric value.
      - name: previous_price_dollars
        description: Prior market price snapshot in dollars as a numeric value.
      - name: previous_yes_ask_dollars
        description: Prior yes-side ask price in dollars as a numeric value.
      - name: previous_yes_bid_dollars
        description: Prior yes-side bid price in dollars as a numeric value.
      - name: yes_ask_dollars
        description: Current yes-side ask price in dollars as a numeric value.
      - name: yes_bid_dollars
        description: Current yes-side bid price in dollars as a numeric value.
      - name: open_interest_fp
        description: Fixed-point open interest reported for the market.
      - name: volume_24h_fp
        description: Fixed-point trailing 24-hour traded volume for the market.
      - name: volume_fp
        description: Fixed-point total traded volume for the market.
      - name: yes_ask_size_fp
        description: Fixed-point size at the top of the yes-side ask.
      - name: yes_bid_size_fp
        description: Fixed-point size at the top of the yes-side bid.
      - name: settlement_timer_seconds
        description: Settlement timer countdown for the market, in seconds.
      - name: tick_size
        description: Minimum price increment for orders on the market.
      - name: floor_strike
        description: Lower strike bound for ranged markets.
      - name: cap_strike
        description: Upper strike bound for ranged markets.
      - name: custom_strike
        description: Custom strike payload for non-standard market structures.
      - name: price_ranges
        description: Nested payload describing price-range buckets used for scalar markets.
  - name: stg_kalshi_market_orderbooks
    description: One-to-one staging view over the raw Kalshi market order books table.
    columns:
      - name: market_ticker
        description: Kalshi market ticker for the orderbook snapshot.
        tests:
          - not_null
          - unique
      - name: orderbook
        description: JSON orderbook snapshot containing yes_dollars and no_dollars bid ladders.
  - name: stg_kalshi_market_trades
    description: Typed staging view over raw Kalshi market trades with normalized identifiers and timestamps.
    columns:
      - name: trade_id
        description: Stable Kalshi trade identifier.
        tests:
          - not_null
          - unique
      - name: market_ticker
        description: Market ticker for the traded market.
      - name: count_fp
        description: Fixed-point trade size returned by the API.
      - name: taker_side
        description: Side of the aggressing order for the trade.
      - name: no_price_dollars
        description: No-side execution price in dollars.
      - name: yes_price_dollars
        description: Yes-side execution price in dollars.
      - name: trade_time
        description: Trade execution timestamp normalized to Snowflake TIMESTAMP_NTZ.
  - name: stg_kalshi_events
    description: Typed staging view over raw Kalshi events with normalized event metadata and category.
    columns:
      - name: event_ticker
        description: Stable Kalshi event identifier sourced from RAW_EVENTS.event_ticker.
        tests:
          - not_null
          - unique
      - name: series_ticker
        description: Series identifier shared across related Kalshi events.
        tests:
          - relationships:
              arguments:
                to: ref('stg_kalshi_series')
                field: series_ticker
      - name: category
        description: Event category used to group markets into broad topical buckets.
      - name: event_title
        description: Human-readable event title.
      - name: event_subtitle
        description: Secondary event label from the Kalshi API.
      - name: is_available_on_brokers
        description: Whether the event is available through partnered brokers.
      - name: is_mutually_exclusive
        description: Whether the event's markets are mutually exclusive outcomes.
      - name: collateral_return_type
        description: Collateral return policy applied to the event's markets.
      - name: updated_at
        description: Event metadata update timestamp normalized to Snowflake TIMESTAMP_NTZ.
      - name: product_metadata
        description: Nested JSON metadata returned for product-specific event details.
  - name: stg_kalshi_series
    description: Typed staging view over raw Kalshi series with normalized series metadata.
    columns:
      - name: series_ticker
        description: Stable Kalshi series identifier sourced from RAW_SERIES.ticker.
        tests:
          - not_null
          - unique
      - name: category
        description: Broad series category used to group related recurring event templates.
      - name: series_title
        description: Human-readable series title.
      - name: tags
        description: Kalshi-provided tags associated with the series.
      - name: frequency
        description: Recurrence cadence for the series, such as daily or monthly.
      - name: fee_multiplier
        description: Numeric multiplier used in Kalshi fee calculations for the series.
      - name: fee_type
        description: Fee model applied to contracts in the series.
      - name: updated_at
        description: Series metadata update timestamp normalized to Snowflake TIMESTAMP_NTZ.
  - name: stg_mlb_teams
    description: Latest MLB team row per team_id from Snowpipe-loaded raw team snapshots.
    columns:
      - name: team_id
        description: Stable MLB Stats API team identifier.
        tests:
          - not_null
          - unique
      - name: full_team_name
        description: Full franchise name returned by the MLB Stats API.
      - name: abbreviation
        description: Official team abbreviation.
      - name: league_id
        description: MLB Stats API league identifier.
      - name: division_id
        description: MLB Stats API division identifier.
      - name: ingested_at
        description: Timestamp assigned by the Lambda when the source file was written to S3.
      - name: snowpipe_loaded_at
        description: Timestamp Snowflake recorded when scanning the source file.
