version: 2

sources:
  - name: kalshi_raw
    description: Raw Kalshi data landed in Snowflake by direct loaders and S3/Snowpipe ingestion paths.
    database: "{{ env_var('DBT_SOURCE_DATABASE', 'PROD') }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'RAW') }}"
    tables:
      - name: markets
        identifier: RAW_MARKETS
        description: Raw market-level payloads from the Kalshi API.
        columns:
          - name: ticker
            description: Stable Kalshi market ticker; the primary join key from markets to downstream trades.
            data_type: string
          - name: event_ticker
            description: Parent event identifier used to join markets back to events.
            data_type: string
          - name: market_type
            description: Kalshi-assigned market type (e.g. binary, scalar).
            data_type: string
          - name: status
            description: Current market lifecycle status returned by the API.
            data_type: string
          - name: result
            description: Settled market outcome once the market resolves.
            data_type: string
          - name: title
            description: Human-readable market title.
            data_type: string
          - name: subtitle
            description: Secondary market label shown alongside the title; staging falls back to yes_sub_title/no_sub_title when the column is absent from the raw payload.
            data_type: string
          - name: yes_sub_title
            description: Yes-side label shown for the market outcome.
            data_type: string
          - name: no_sub_title
            description: No-side label shown for the market outcome.
            data_type: string
          - name: rules_primary
            description: Primary market resolution rules text.
            data_type: string
          - name: rules_secondary
            description: Supplementary market resolution rules text.
            data_type: string
          - name: response_price_units
            description: Unit system the API uses to report market prices (e.g. cents, dollars).
            data_type: string
          - name: price_level_structure
            description: Description of how price levels are bucketed for the market.
            data_type: string
          - name: strike_type
            description: Strike configuration assigned to the market (e.g. single, range).
            data_type: string
          - name: expiration_value
            description: Strike expiration value used in market resolution logic.
            data_type: string
          - name: early_close_condition
            description: Condition under which the market can close early.
            data_type: string
          - name: primary_participant_key
            description: Key identifying the primary participant associated with the market.
            data_type: string
          - name: can_close_early
            description: Boolean flag indicating whether the market can close early.
            data_type: boolean
          - name: fractional_trading_enabled
            description: Boolean flag indicating whether fractional trading is enabled for the market.
            data_type: boolean
          - name: created_time
            description: Market creation timestamp returned by the API.
            data_type: timestamp string
          - name: open_time
            description: Market open timestamp returned by the API.
            data_type: timestamp string
          - name: close_time
            description: Market scheduled close timestamp returned by the API.
            data_type: timestamp string
          - name: expected_expiration_time
            description: Expected expiration timestamp returned by the API.
            data_type: timestamp string
          - name: expiration_time
            description: Realized expiration timestamp returned by the API.
            data_type: timestamp string
          - name: latest_expiration_time
            description: Latest possible expiration timestamp returned by the API.
            data_type: timestamp string
          - name: updated_time
            description: Most recent market metadata update timestamp returned by the API.
            data_type: timestamp string
          - name: fee_waiver_expiration_time
            description: Timestamp when the fee waiver on the market expires; staging tolerates the column being absent from the raw payload.
            data_type: timestamp string
          - name: last_price_dollars
            description: Last traded market price in dollar-denominated string form.
            data_type: decimal string
          - name: liquidity_dollars
            description: Reported market liquidity in dollar-denominated string form.
            data_type: decimal string
          - name: no_ask_dollars
            description: Current no-side ask price in dollar-denominated string form.
            data_type: decimal string
          - name: no_bid_dollars
            description: Current no-side bid price in dollar-denominated string form.
            data_type: decimal string
          - name: notional_value_dollars
            description: Notional contract value in dollar-denominated string form.
            data_type: decimal string
          - name: previous_price_dollars
            description: Prior market price snapshot in dollar-denominated string form.
            data_type: decimal string
          - name: previous_yes_ask_dollars
            description: Prior yes-side ask price snapshot in dollar-denominated string form.
            data_type: decimal string
          - name: previous_yes_bid_dollars
            description: Prior yes-side bid price snapshot in dollar-denominated string form.
            data_type: decimal string
          - name: yes_ask_dollars
            description: Current yes-side ask price in dollar-denominated string form.
            data_type: decimal string
          - name: yes_bid_dollars
            description: Current yes-side bid price in dollar-denominated string form.
            data_type: decimal string
          - name: open_interest_fp
            description: Fixed-point open interest reported for the market.
            data_type: decimal string
          - name: volume_24h_fp
            description: Fixed-point trailing 24-hour traded volume for the market.
            data_type: decimal string
          - name: volume_fp
            description: Fixed-point total traded volume for the market.
            data_type: decimal string
          - name: yes_ask_size_fp
            description: Fixed-point size at the top of the yes-side ask.
            data_type: decimal string
          - name: yes_bid_size_fp
            description: Fixed-point size at the top of the yes-side bid.
            data_type: decimal string
          - name: settlement_timer_seconds
            description: Settlement timer countdown for the market, in seconds.
            data_type: integer
          - name: tick_size
            description: Minimum price increment for orders on the market.
            data_type: decimal string
          - name: floor_strike
            description: Lower strike bound for ranged markets; staging tolerates the column being absent from the raw payload.
            data_type: decimal string
          - name: cap_strike
            description: Upper strike bound for ranged markets; staging tolerates the column being absent from the raw payload.
            data_type: decimal string
          - name: custom_strike
            description: Custom strike payload for non-standard market structures.
            data_type: object
          - name: price_ranges
            description: Nested payload describing price-range buckets used for scalar markets.
            data_type: object
          - name: ingested_at
            description: Timestamp assigned by the ingestion job when the source file or direct load row was produced.
            data_type: timestamp
          - name: raw_payload
            description: Original Kalshi market payload retained for audit and schema-drift inspection.
            data_type: object
          - name: source_file
            description: S3 object key loaded by Snowpipe; null for rows written by the direct loader.
            data_type: string
          - name: source_row_number
            description: Row number within the loaded S3 object; null for rows written by the direct loader.
            data_type: number
          - name: snowpipe_loaded_at
            description: Timestamp Snowflake recorded when scanning the source file; null for rows written by the direct loader.
            data_type: timestamp
      - name: market_orderbooks
        identifier: RAW_MARKET_ORDERBOOKS
        description: Raw order book snapshots keyed by market ticker.
        columns:
          - name: market_ticker
            description: Kalshi market ticker for the orderbook snapshot.
            data_type: string
          - name: orderbook
            description: JSON orderbook snapshot containing yes_dollars and no_dollars price ladders.
            data_type: object
          - name: ingested_at
            description: Timestamp assigned by the ingestion job when the source file or direct load row was produced.
            data_type: timestamp
          - name: raw_payload
            description: Original Kalshi orderbook payload retained for audit and schema-drift inspection.
            data_type: object
          - name: source_file
            description: S3 object key loaded by Snowpipe; null for rows written by the direct loader.
            data_type: string
          - name: source_row_number
            description: Row number within the loaded S3 object; null for rows written by the direct loader.
            data_type: number
          - name: snowpipe_loaded_at
            description: Timestamp Snowflake recorded when scanning the source file; null for rows written by the direct loader.
            data_type: timestamp
      - name: market_trades
        identifier: RAW_MARKET_TRADES
        description: Raw trade-level payloads from the Kalshi API.
        columns:
          - name: trade_id
            description: Stable Kalshi trade identifier.
            data_type: string
          - name: ticker
            description: Market ticker for the traded market.
            data_type: string
          - name: count_fp
            description: Fixed-point trade size returned by the API.
            data_type: decimal string
          - name: yes_price_dollars
            description: Yes-side execution price in dollar-denominated string form.
            data_type: decimal string
          - name: no_price_dollars
            description: No-side execution price in dollar-denominated string form.
            data_type: decimal string
          - name: taker_side
            description: Side of the aggressing order for the trade.
            data_type: string
          - name: created_time
            description: Trade execution timestamp returned by the API.
            data_type: timestamp string
          - name: ingested_at
            description: Timestamp assigned by the ingestion job when the source file or direct load row was produced.
            data_type: timestamp
          - name: raw_payload
            description: Original Kalshi trade payload retained for audit and schema-drift inspection.
            data_type: object
          - name: source_file
            description: S3 object key loaded by Snowpipe; null for rows written by the direct loader.
            data_type: string
          - name: source_row_number
            description: Row number within the loaded S3 object; null for rows written by the direct loader.
            data_type: number
          - name: snowpipe_loaded_at
            description: Timestamp Snowflake recorded when scanning the source file; null for rows written by the direct loader.
            data_type: timestamp
      - name: events
        identifier: RAW_EVENTS
        description: Current-state event-level payloads from the Kalshi API, keyed by event_ticker after direct loading or Snowpipe merge.
        columns:
          - name: event_ticker
            description: Stable Kalshi event ticker; the primary join key from events to markets.
            data_type: string
          - name: series_ticker
            description: Parent series identifier used to join events back to series.
            data_type: string
          - name: category
            description: Broad topic grouping assigned by Kalshi.
            data_type: string
          - name: title
            description: Human-readable event title.
            data_type: string
          - name: sub_title
            description: Secondary event label shown alongside the title.
            data_type: string
          - name: available_on_brokers
            description: Boolean flag indicating whether the event is available through partnered brokers.
            data_type: boolean
          - name: mutually_exclusive
            description: Boolean flag indicating whether the event's markets are mutually exclusive outcomes.
            data_type: boolean
          - name: collateral_return_type
            description: Collateral return policy applied to the event's markets.
            data_type: string
          - name: last_updated_ts
            description: Most recent event metadata update timestamp returned by the API.
            data_type: timestamp string
          - name: product_metadata
            description: Nested JSON metadata returned for product-specific event details.
            data_type: object
          - name: ingested_at
            description: Timestamp assigned by the ingestion job when the source file or direct load row was produced.
            data_type: timestamp
          - name: raw_payload
            description: Original Kalshi event payload retained for audit and schema-drift inspection.
            data_type: object
          - name: source_file
            description: S3 object key loaded by Snowpipe; null for rows written by the direct loader.
            data_type: string
          - name: source_row_number
            description: Row number within the loaded S3 object; null for rows written by the direct loader.
            data_type: number
          - name: snowpipe_loaded_at
            description: Timestamp Snowflake recorded when scanning the source file; null for rows written by the direct loader.
            data_type: timestamp
      - name: series
        identifier: RAW_SERIES
        description: Current-state series-level payloads from the Kalshi API, keyed by ticker after direct loading or Snowpipe merge.
        columns:
          - name: ticker
            description: Stable Kalshi series ticker; the primary join key from series to events.
            data_type: string
          - name: category
            description: Broad category used to group related recurring event templates.
            data_type: string
          - name: title
            description: Human-readable series title.
            data_type: string
          - name: tags
            description: List of Kalshi-provided tags attached to the series.
            data_type: variant
          - name: frequency
            description: Recurrence cadence for events in the series.
            data_type: string
          - name: fee_type
            description: Fee model applied to contracts in the series.
            data_type: string
          - name: fee_multiplier
            description: Numeric multiplier used in Kalshi fee calculations.
            data_type: integer
          - name: last_updated_ts
            description: Most recent series metadata update timestamp returned by the API.
            data_type: timestamp string
          - name: ingested_at
            description: Timestamp assigned by the ingestion job when the source file or direct load row was produced.
            data_type: timestamp
          - name: raw_payload
            description: Original Kalshi series payload retained for audit and schema-drift inspection.
            data_type: object
          - name: source_file
            description: S3 object key loaded by Snowpipe; null for rows written by the direct loader.
            data_type: string
          - name: source_row_number
            description: Row number within the loaded S3 object; null for rows written by the direct loader.
            data_type: number
          - name: snowpipe_loaded_at
            description: Timestamp Snowflake recorded when scanning the source file; null for rows written by the direct loader.
            data_type: timestamp
  - name: mlb_raw
    description: Raw MLB reference data landed in Snowflake by S3 and Snowpipe.
    database: "{{ env_var('DBT_SOURCE_DATABASE', 'PROD') }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'RAW') }}"
    tables:
      - name: teams
        identifier: RAW_MLB_TEAMS
        description: Append-only MLB team metadata snapshots loaded from S3 JSON Lines files by Snowpipe.
        columns:
          - name: team_id
            description: Stable MLB Stats API team identifier.
            data_type: number
          - name: name
            description: Full team name returned by the MLB Stats API.
            data_type: string
          - name: team_code
            description: MLB team code returned by the MLB Stats API.
            data_type: string
          - name: abbreviation
            description: Official team abbreviation.
            data_type: string
          - name: team_name
            description: Short team nickname.
            data_type: string
          - name: location_name
            description: Team location name.
            data_type: string
          - name: first_year_of_play
            description: First year of play reported by the MLB Stats API.
            data_type: number
          - name: sport_id
            description: MLB Stats API sport identifier.
            data_type: number
          - name: sport_name
            description: Sport name returned by the MLB Stats API.
            data_type: string
          - name: league_id
            description: MLB Stats API league identifier.
            data_type: number
          - name: league_name
            description: League name returned by the MLB Stats API.
            data_type: string
          - name: division_id
            description: MLB Stats API division identifier.
            data_type: number
          - name: division_name
            description: Division name returned by the MLB Stats API.
            data_type: string
          - name: venue_id
            description: MLB Stats API venue identifier.
            data_type: number
          - name: venue_name
            description: Venue name returned by the MLB Stats API.
            data_type: string
          - name: active
            description: Whether the team is active in the MLB Stats API response.
            data_type: boolean
          - name: ingested_at
            description: Timestamp assigned by the Lambda when the source file was written to S3.
            data_type: timestamp
          - name: raw_payload
            description: Original MLB Stats API team payload.
            data_type: object
          - name: source_file
            description: S3 object key loaded by Snowpipe.
            data_type: string
          - name: source_row_number
            description: Row number within the loaded S3 object.
            data_type: number
          - name: snowpipe_loaded_at
            description: Timestamp Snowflake recorded when scanning the source file.
            data_type: timestamp
